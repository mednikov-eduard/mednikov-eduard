<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42b883"/>
      <stop offset="1" stop-color="#3178c6"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="230" rx="18"/></clipPath>
    <style>
      .wave { animation: drift 9s ease-in-out infinite alternate; }
      .wave2 { animation: drift 13s ease-in-out infinite alternate-reverse; }
      .t { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #fff; }
